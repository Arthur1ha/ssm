<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSM · 伙伴形象预览</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/avatars.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
    main { max-width: 860px; margin: auto; padding: 40px 20px; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--color-text-muted); font-size: 13px; line-height: 1.7; }
    .preview-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 16px; margin: 28px 0; }
    .preview-controls label { display: grid; gap: 6px; font-size: 12px; color: var(--color-text-muted); }
    select, button { background: var(--color-surface-2); border: 1px solid var(--color-border-strong); color: var(--color-text); font: inherit; padding: 9px 12px; border-radius: 8px; }
    button { cursor: pointer; font-size: 12px; }
    .preview-row { margin-top: 16px; padding: 20px; background: var(--color-surface-1); border: 1px solid var(--color-border); border-radius: 12px; }
    .preview-row h2 { margin: 0 0 8px; font-size: 14px; }
    .preview-shapes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 12px 0 0; display: flex; align-items: center; flex-direction: column; gap: 8px; }
    figcaption { color: var(--color-text-muted); font-size: 12px; }
    .preview-note { margin-top: 24px; color: var(--color-text-dim); font-size: 12px; }
    @media (max-width: 420px) { .preview-shapes { gap: 4px; } .preview-row { padding: 16px 12px; } .shape-face { width: 64px; height: 64px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="src/utils/agentMeta.js"></script>
  <script src="src/avatars/registry.js"></script>
  <script type="text/babel" src="src/avatars/Avatar.jsx"></script>
  <script type="text/babel">
    function AvatarPreview() {
      const [expression, setExpression] = React.useState('neutral');
      const [motion, setMotion] = React.useState('pop');
      const [play, setPlay] = React.useState(null);
      return <main>
        <h1>一个轮廓，两眼一嘴</h1>
        <p>同一张脸，自由变形。颜色和轮廓保留伙伴之间的区别。</p>
        <div className="preview-controls">
          <label>表情<select value={expression} onChange={event => setExpression(event.target.value)}>
            {Object.entries(AVATAR_EXPRESSIONS).map(([id, value]) => <option key={id} value={id}>{value.label}</option>)}
          </select></label>
          <label>动效<select value={motion} onChange={event => setMotion(event.target.value)}>
            {Object.entries(AVATAR_MOTIONS).map(([id, label]) => <option key={id} value={id}>{label}</option>)}
          </select></label>
          <button onClick={() => setPlay(value => (value || 0) + 1)}>播放一次</button>
        </div>
        {[['esp32_desk_led', '皮皮 · 圆润'], ['go2', '呆呆 · 利落'], ['unknown', '新伙伴 · 中性']].map(([id, name]) =>
          <section className="preview-row" key={id}>
            <h2>{name}</h2><div className="preview-shapes">
              {Object.entries(AVATAR_SHAPES).map(([shape, value]) => <figure key={shape}>
                <ShapeFace unitId={id} shape={shape} expression={expression} motion={motion}
                  animationKey={play} size={100} label={`${name} · ${value.label}`}/>
                <figcaption>{shape === 'idle' ? '日常' : value.label}</figcaption>
              </figure>)}
            </div>
          </section>)}
        <p className="preview-note">本页仅预览形象，不连接设备。活动中的手势来自已公开的真实游戏结果；形象表情不代表设备物理状态。系统开启“减少动态效果”时，动效自动停用。</p>
      </main>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<AvatarPreview/>);
  </script>
</body>
</html>
